<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">起業プロジェクト</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    /* ── Design tokens ────────────────────────────────────── */
    :root {
      --bg:           #16121f;
      --surface:      #211b30;
      --surface-2:    #2b2440;
      --text:         #f1ecfb;
      --text-dim:     #a99fc4;
      --primary:      #8b5cf6;
      --primary-dark: #7c3aed;
      --primary-pale: #c4b5fd;
      --primary-grad: linear-gradient(135deg,#8b5cf6,#d946ef);
      --border:       rgba(255,255,255,.07);
      --border-acc:   rgba(139,92,246,.35);
      --shadow:       0 8px 24px rgba(139,92,246,.12);
      --shadow-hover: 0 12px 32px rgba(139,92,246,.22);
      --radius:       16px;
      --radius-sm:    10px;
      /* Section colors — used only on chips, left-borders, and icon tints */
      --c-roadmap:   #fbbf24;
      --c-canvas:    #22d3ee;
      --c-minutes:   #38bdf8;
      --c-decisions: #34d399;
      --c-ideas:     #f472b6;
      --c-points:    #fb923c;
      --c-design:    #a78bfa;
      --c-notes:     #94a3b8;
      --c-links:     #2dd4bf;
      /* Legacy compat aliases */
      --accent:       #8b5cf6;
      --accent-light: #a78bfa;
      --accent-dim:   rgba(139,92,246,.15);
      --surface2:     #2b2440;
      --surface3:     #312a4a;
      --border-light: rgba(255,255,255,.1);
      --green:        rgba(34,197,94,.8);
      --yellow:       rgba(234,179,8,.8);
      --text-muted:   #a99fc4;
    }

    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ── Header ──────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(8px);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; gap: 12px;
    }
    .logo {
      font-family: 'Zen Maru Gothic',sans-serif;
      font-size: 15px; font-weight: 700;
      color: var(--text); text-decoration: none;
      white-space: nowrap; flex-shrink: 0;
    }
    nav {
      display: flex; gap: 2px;
      overflow-x: auto; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      color: var(--text-dim); text-decoration: none;
      padding: 6px 10px; border-radius: 8px;
      font-size: 12px; white-space: nowrap;
      transition: color .15s, background .15s;
      min-height: 44px; display: flex; align-items: center;
      position: relative;
    }
    nav a::after {
      content: '';
      position: absolute; bottom: 4px; left: 10px; right: 10px;
      height: 2px; border-radius: 1px;
      background: currentColor;
      transform: scaleX(0); transition: transform .2s;
    }
    nav a:hover { background: rgba(255,255,255,.05); }
    nav a.active::after, nav a:hover::after { transform: scaleX(.7); }
    nav a[data-section="roadmap"]:hover,   nav a[data-section="roadmap"].active   { color: var(--c-roadmap); }
    nav a[data-section="canvas"]:hover,    nav a[data-section="canvas"].active    { color: var(--c-canvas); }
    nav a[data-section="minutes"]:hover,   nav a[data-section="minutes"].active   { color: var(--c-minutes); }
    nav a[data-section="decisions"]:hover, nav a[data-section="decisions"].active { color: var(--c-decisions); }
    nav a[data-section="ideas"]:hover,     nav a[data-section="ideas"].active     { color: var(--c-ideas); }
    nav a[data-section="points"]:hover,    nav a[data-section="points"].active    { color: var(--c-points); }
    nav a[data-section="blueprint"]:hover, nav a[data-section="blueprint"].active { color: var(--c-design); }
    nav a[data-section="notes"]:hover,     nav a[data-section="notes"].active     { color: var(--c-notes); }
    nav a[data-section="links"]:hover,     nav a[data-section="links"].active     { color: var(--c-links); }

    main { max-width: 1280px; margin: 0 auto; padding: 28px 20px 80px; }

    /* ── Home 2-col layout ───────────────────────────────── */
    .home-layout { display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 1024px) {
      .home-layout { grid-template-columns: 1fr 280px; align-items: start; }
    }
    .home-main { min-width: 0; }
    .home-sidebar { display: none; }
    @media (min-width: 1024px) {
      .home-sidebar { display: block; position: sticky; top: 80px; }
    }

    /* ── Hero ────────────────────────────────────────────── */
    .hero { margin-bottom: 20px; }
    .hero h1 {
      font-family: 'Zen Maru Gothic',sans-serif;
      font-size: clamp(22px,5vw,30px); font-weight: 700; line-height: 1.25;
      background: var(--primary-grad);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Concept card ────────────────────────────────────── */
    .concept-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .concept-label {
      font-family: 'Zen Maru Gothic',sans-serif;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .1em;
      color: var(--primary); margin-bottom: 10px;
    }
    .concept-headline {
      font-family: 'Zen Maru Gothic',sans-serif;
      font-size: clamp(15px,2.5vw,17px); font-weight: 700;
      line-height: 1.5; color: var(--text); margin-bottom: 12px;
    }
    .concept-bullets {
      display: flex; flex-direction: column; gap: 6px;
    }
    .concept-bullet {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 13px; color: var(--text-dim); line-height: 1.5;
    }
    .concept-bullet::before {
      content: '';
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--primary); flex-shrink: 0; margin-top: 7px;
    }

    /* ── Mobile accordion stepper ────────────────────────── */
    .mobile-phase-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border-acc);
      border-radius: var(--radius-sm); padding: 12px 16px;
      margin-bottom: 16px; cursor: pointer; gap: 10px; user-select: none;
    }
    @media (min-width: 1024px) { .mobile-phase-bar, .mobile-stepper-accordion { display: none !important; } }
    .mobile-phase-label { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; }
    .mobile-phase-chevron { color: var(--text-dim); font-size: 11px; transition: transform .2s; }
    .mobile-phase-chevron.open { transform: rotate(180deg); }
    .mobile-stepper-accordion {
      display: none;
      background: var(--surface); border: 1px solid var(--border-acc);
      border-radius: var(--radius-sm); padding: 16px; margin-bottom: 20px;
    }
    .mobile-stepper-accordion.open { display: block; }

    /* ── Sidebar card ────────────────────────────────────── */
    .sidebar-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }
    .sidebar-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .sidebar-card-title {
      font-family: 'Zen Maru Gothic',sans-serif;
      font-size: 11px; font-weight: 700;
      color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em;
    }

    /* ── Vertical stepper ────────────────────────────────── */
    .stepper-summary { margin-bottom: 20px; }
    .stepper-summary-label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    .stepper-summary-bar { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
    .stepper-summary-fill { height: 100%; background: var(--primary-grad); border-radius: 2px; transition: width .4s; }

    .stepper { display: flex; flex-direction: column; }
    .stepper-item { display: flex; gap: 14px; }
    .stepper-left { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .stepper-circle {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0; position: relative; z-index: 1;
    }
    .stepper-circle.done { background: var(--primary-grad); color: #fff; }
    .stepper-circle.active {
      background: var(--primary-grad); color: #fff;
      animation: stepper-glow 2s ease-in-out infinite;
    }
    @keyframes stepper-glow {
      0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,.5); }
      50%      { box-shadow: 0 0 0 6px rgba(139,92,246,.18); }
    }
    .stepper-circle.todo { background: transparent; color: var(--text-dim); border: 2px dashed rgba(255,255,255,.2); }
    .stepper-line { width: 2px; flex: 1; min-height: 16px; margin: 4px 0; }
    .stepper-line.done { background: rgba(139,92,246,.5); }
    .stepper-line.active { background: linear-gradient(to bottom,rgba(139,92,246,.5),rgba(255,255,255,.07)); }
    .stepper-line.todo {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,.12) 0,rgba(255,255,255,.12) 4px,
        transparent 4px,transparent 10px
      );
    }
    .stepper-content { padding: 4px 0 20px; flex: 1; }
    .stepper-item:last-child .stepper-content { padding-bottom: 0; }
    .stepper-name {
      font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--text);
      display: flex; align-items: flex-start; gap: 6px; flex-wrap: wrap;
    }
    .stepper-name.todo { color: var(--text-dim); }
    .imahere-pill {
      display: inline-flex; align-items: center;
      background: rgba(139,92,246,.2); border: 1px solid rgba(139,92,246,.4);
      color: var(--primary-pale); border-radius: 999px; padding: 1px 8px;
      font-size: 10px; font-weight: 700; white-space: nowrap; flex-shrink: 0;
      margin-top: 2px;
    }

    /* ── Today section ───────────────────────────────────── */
    .today-section {
      background: var(--surface); border: 1px solid var(--border-acc);
      border-radius: var(--radius); padding: 18px 20px;
      margin-bottom: 24px; box-shadow: var(--shadow);
    }
    .today-section-title {
      font-family: 'Zen Maru Gothic',sans-serif;
      font-size: 13px; font-weight: 700; color: var(--primary);
    }
    .today-empty { font-size: 13px; color: var(--text-dim); padding: 4px 0; }
    .today-task {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .today-task:last-child { border-bottom: none; }
    .today-task-check {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 10px;
    }
    .today-task-check.todo  { border-color: var(--text-dim); color: transparent; }
    .today-task-check.doing { border-color: var(--primary); color: var(--primary); animation: dot-pulse 1.8s infinite; }
    .today-task-check.done  { border-color: rgba(34,197,94,.8); background: rgba(34,197,94,.15); color: #86efac; }
    .today-task-text { font-size: 14px; flex: 1; }
    .today-task-text.done-txt { text-decoration: line-through; color: var(--text-dim); }
    .today-task-phase {
      font-size: 10px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px;
      background: var(--surface-2); color: var(--text-dim); white-space: nowrap;
    }
    /* legacy compat */
    .status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.doing { background: var(--accent); animation: dot-pulse 1.8s infinite; }
    .status-dot.todo  { background: transparent; border: 2px solid var(--text-muted); }
    .status-dot.done  { background: var(--green); }
    @keyframes dot-pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

    /* ── Timeline (minutes) ──────────────────────────────── */
    .quick-add {
      background: var(--surface); border: 1px solid var(--border-acc);
      border-radius: var(--radius); padding: 18px 20px;
      margin-bottom: 28px; box-shadow: var(--shadow);
    }
    .quick-add-title {
      font-family: 'Zen Maru Gothic',sans-serif;
      font-size: 13px; font-weight: 700; color: var(--c-minutes);
      margin-bottom: 14px;
    }
    .qa-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .qa-row .form-input { flex: 1; min-width: 140px; }
    .qa-row .form-input-date { width: 140px; flex-shrink: 0; }
    .tl-list { display: flex; flex-direction: column; }
    .tl-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 4px;
      border-bottom: 1px solid var(--border); text-decoration: none; color: inherit;
      transition: background .12s; border-radius: 8px;
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-item:hover { background: var(--surface-2); }
    .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-minutes); flex-shrink: 0; margin-left: 4px; }
    .tl-date { font-size: 12px; color: var(--text-dim); white-space: nowrap; min-width: 76px; }
    .tl-title { flex: 1; font-size: 14px; font-weight: 500; }
    .tl-arr { color: var(--c-minutes); font-size: 14px; flex-shrink: 0; }

    /* ── Cards ───────────────────────────────────────────── */
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 480px) { .card-grid { grid-template-columns: repeat(2,1fr); } }
    @media (min-width: 720px) { .card-grid { grid-template-columns: repeat(3,1fr); } }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      text-decoration: none; color: inherit; display: block;
      transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
      cursor: pointer; box-shadow: var(--shadow);
    }
    .card:hover {
      border-color: var(--border-acc); background: var(--surface-2);
      transform: translateY(-2px); box-shadow: var(--shadow-hover);
    }
    .card:active { transform: scale(.98); box-shadow: var(--shadow); }
    @media (prefers-reduced-motion: reduce) {
      .card:hover, .card:active { transform: none; }
      .stepper-circle.active { animation: none; }
      .today-task-check.doing, .status-dot.doing, .rm-status-btn.doing { animation: none; }
    }

    /* Icon chip */
    .card-icon-chip {
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px; flex-shrink: 0;
    }
    .card-icon-chip svg { width: 22px; height: 22px; }
    .chip-roadmap   { background: rgba(251,191,36,.12);  color: #fbbf24; }
    .chip-canvas    { background: rgba(34,211,238,.12);  color: #22d3ee; }
    .chip-minutes   { background: rgba(56,189,248,.12);  color: #38bdf8; }
    .chip-decisions { background: rgba(52,211,153,.12);  color: #34d399; }
    .chip-ideas     { background: rgba(244,114,182,.12); color: #f472b6; }
    .chip-points    { background: rgba(251,146,60,.12);  color: #fb923c; }
    .chip-blueprint { background: rgba(167,139,250,.12); color: #a78bfa; }
    .chip-notes     { background: rgba(148,163,184,.12); color: #94a3b8; }
    .chip-links     { background: rgba(45,212,191,.12);  color: #2dd4bf; }

    .card-title { font-family: 'Zen Maru Gothic',sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .card-preview { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
    .card-meta { font-size: 11px; color: var(--text-dim); margin-top: 8px; }
    .card-empty-hint { font-size: 12px; color: var(--primary); margin-top: 8px; opacity: .85; }

    /* ── Page heading ────────────────────────────────────── */
    .page-heading {
      margin-bottom: 24px; display: flex; align-items: center;
      justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .page-heading h2 { font-family: 'Zen Maru Gothic',sans-serif; font-size: 22px; font-weight: 700; }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--accent-light); text-decoration: none;
      font-size: 14px; font-weight: 500;
      min-height: 44px; padding: 8px 0; margin-bottom: 16px;
    }
    .back-link:hover { color: var(--text); }

    /* ── List ────────────────────────────────────────────── */
    .item-list { display: flex; flex-direction: column; gap: 8px; }
    .list-item {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 18px;
      text-decoration: none; color: inherit;
      display: flex; justify-content: space-between; align-items: center;
      min-height: 44px; transition: border-color .15s, background .15s, transform .12s; gap: 12px;
    }
    .list-item:hover { border-color: var(--border-acc); background: var(--surface-2); transform: translateY(-1px); }
    .list-item-title { font-size: 14px; font-weight: 500; }
    .list-item-date { font-size: 12px; color: var(--text-dim); flex-shrink: 0; }

    /* ── Markdown ────────────────────────────────────────── */
    .md-content { line-height: 1.85; font-size: 15px; }
    .md-content h1 { font-family: 'Zen Maru Gothic',sans-serif; font-size: 22px; font-weight: 700; margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .md-content h2 { font-family: 'Zen Maru Gothic',sans-serif; font-size: 17px; font-weight: 700; margin: 28px 0 12px; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--accent-light); }
    .md-content h3 { font-family: 'Zen Maru Gothic',sans-serif; font-size: 15px; font-weight: 700; margin: 20px 0 8px; padding-left: 10px; border-left: 2px solid rgba(139,92,246,.4); }
    .md-content p { margin: 10px 0; }
    .md-content ul,.md-content ol { padding-left: 24px; margin: 8px 0; }
    .md-content li { margin: 4px 0; }
    .md-content strong { color: var(--text); font-weight: 700; }
    .md-content a { color: var(--accent-light); }
    .md-content code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: "SFMono-Regular",Consolas,monospace; }
    .md-content pre { background: var(--surface-2); border: 1px solid var(--border); padding: 16px; border-radius: 10px; overflow-x: auto; margin: 12px 0; }
    .md-content pre code { background: none; padding: 0; }
    .md-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; margin: 12px 0; color: var(--text-dim); }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ── Roadmap ─────────────────────────────────────────── */
    .rm-focus { background: var(--surface-2); border: 1px solid var(--border-acc); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 20px; }
    .rm-focus-title { font-family: 'Zen Maru Gothic',sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--c-roadmap); font-weight: 700; margin-bottom: 10px; }
    .rm-phase { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .rm-phase-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; transition: background .15s; }
    .rm-phase-header:hover { background: var(--surface-2); }
    .rm-phase-name { font-family: 'Zen Maru Gothic',sans-serif; font-size: 15px; font-weight: 700; flex: 1; }
    .rm-phase-prog { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
    .rm-phase-toggle { color: var(--text-dim); font-size: 12px; transition: transform .2s; }
    .rm-phase-toggle.open { transform: rotate(180deg); }
    .rm-prog-bar { height: 3px; background: var(--surface-2); margin: 0 16px; }
    .rm-prog-fill { height: 100%; background: var(--primary-grad); border-radius: 2px; transition: width .3s; }
    .rm-tasks { padding: 8px 16px 12px; }
    .rm-task { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .rm-task:last-child { border-bottom: none; }
    .rm-status-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; transition: all .15s; background: transparent; }
    .rm-status-btn.todo  { border-color: var(--text-muted); color: transparent; }
    .rm-status-btn.doing { border-color: var(--accent); color: var(--accent); animation: dot-pulse 1.8s infinite; }
    .rm-status-btn.done  { border-color: rgba(34,197,94,.7); background: rgba(34,197,94,.2); color: #86efac; }
    .rm-task-text { flex: 1; font-size: 14px; line-height: 1.4; }
    .rm-task-text.done { text-decoration: line-through; color: var(--text-dim); }
    .rm-task-date { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
    .rm-task-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .rm-task:hover .rm-task-actions { opacity: 1; }
    .rm-add-task { display: flex; align-items: center; gap: 6px; padding: 8px 4px; font-size: 13px; color: var(--accent-light); background: none; border: none; cursor: pointer; font-family: inherit; transition: color .15s; }
    .rm-add-task:hover { color: var(--text); }
    .rm-phase-actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* Horizontal sugoroku (roadmap page) */
    .sugoroku { overflow-x: auto; scrollbar-width: none; padding: 4px 0 2px; -webkit-overflow-scrolling: touch; }
    .sugoroku::-webkit-scrollbar { display: none; }
    .sg-bubbles,.sg-names { display: flex; align-items: center; min-width: max-content; }
    .sg-bub { flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; transition: all .2s; }
    .sg-bub.done   { background: rgba(139,92,246,.28); border: 2px solid rgba(139,92,246,.55); color: var(--accent-light); }
    .sg-bub.active { background: rgba(139,92,246,.12); border: 2px solid var(--accent); color: var(--accent-light); animation: sg-glow 2s ease-in-out infinite; }
    .sg-bub.todo   { background: transparent; border: 2px dashed rgba(255,255,255,.12); color: var(--text-muted); }
    @keyframes sg-glow { 0%,100% { box-shadow:0 0 0 0 rgba(139,92,246,.5); } 50% { box-shadow:0 0 14px 3px rgba(139,92,246,.35); } }
    .sg-wire { height: 2px; flex-shrink: 0; align-self: center; }
    .sg-wire.done   { background: rgba(139,92,246,.5); }
    .sg-wire.active { background: linear-gradient(to right,rgba(139,92,246,.45),rgba(255,255,255,.07)); }
    .sg-wire.todo   { background: repeating-linear-gradient(to right,rgba(255,255,255,.12) 0,rgba(255,255,255,.12) 4px,transparent 4px,transparent 10px); }
    .sg-nm { flex-shrink: 0; font-size: 10px; text-align: center; line-height: 1.3; overflow: hidden; }
    .sg-nm.done   { color: var(--text-muted); }
    .sg-nm.active { color: var(--accent-light); font-weight: 700; }
    .sg-nm.todo   { color: rgba(157,148,184,.4); }
    .sg-sp { flex-shrink: 0; }

    /* ── Lean canvas ─────────────────────────────────────── */
    .canvas-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 720px) {
      .canvas-grid { grid-template-columns: repeat(5,1fr); grid-template-rows: 180px 160px 110px; }
      .cb-mondai   { grid-column:1;   grid-row:1/3; }
      .cb-kaiketsu { grid-column:2;   grid-row:1;   }
      .cb-uvp      { grid-column:3;   grid-row:1/3; }
      .cb-yuui     { grid-column:4;   grid-row:1;   }
      .cb-customer { grid-column:5;   grid-row:1/3; }
      .cb-shihyo   { grid-column:2;   grid-row:2;   }
      .cb-channel  { grid-column:4;   grid-row:2;   }
      .cb-cost     { grid-column:1/3; grid-row:3;   }
      .cb-revenue  { grid-column:3/6; grid-row:3;   }
    }
    .canvas-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; transition: border-color .15s; }
    .canvas-block:focus-within { border-color: var(--border-acc); }
    .cb-label { font-family: 'Zen Maru Gothic',sans-serif; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--c-canvas); }
    .cb-hint { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
    .cb-ta { flex: 1; background: transparent; border: none; color: var(--text); font-size: 13px; font-family: inherit; resize: none; line-height: 1.7; outline: none; min-height: 60px; }
    .cb-ta::placeholder { color: rgba(169,159,196,.4); }
    .canvas-note { font-size: 12px; color: var(--text-dim); margin-top: 8px; padding: 10px 14px; background: var(--surface-2); border-radius: 8px; }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: background .15s, transform .1s; min-height: 44px; font-family: inherit; text-decoration: none; }
    .btn:active { transform: scale(.97); }
    .btn-primary   { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--border-acc); }
    .btn-ghost     { background: transparent; color: var(--accent-light); border: 1px solid var(--border-acc); }
    .btn-ghost:hover { background: var(--accent-dim); }
    .btn-danger    { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .btn-danger:hover { background: rgba(239,68,68,.25); }
    .btn-sm { padding: 5px 12px; font-size: 13px; min-height: 36px; }
    .icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; border-radius: 6px; font-size: 13px; transition: color .15s, background .15s; min-width: 28px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center; font-family: inherit; }
    .icon-btn:hover { color: var(--text); background: var(--surface-2); }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    @media (min-width: 600px) { .modal-overlay { align-items: center; } }
    .modal { background: var(--surface); border-radius: 20px 20px 0 0; width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; transform: translateY(40px); transition: transform .2s; }
    @media (min-width: 600px) { .modal { border-radius: 20px; transform: scale(.95); } }
    .modal-overlay.open .modal { transform: translateY(0); }
    @media (min-width: 600px) { .modal-overlay.open .modal { transform: scale(1); } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .modal-title { font-family: 'Zen Maru Gothic',sans-serif; font-size: 16px; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 20px; min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    .modal-close:hover { color: var(--text); background: var(--surface-2); }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; flex-wrap: wrap; }

    /* ── Forms ───────────────────────────────────────────── */
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
    .form-input,.form-textarea,.form-select { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; padding: 10px 12px; font-family: inherit; transition: border-color .15s; }
    .form-input:focus,.form-textarea:focus,.form-select:focus { outline: none; border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 160px; line-height: 1.7; }
    .form-textarea.mono { font-family: "SFMono-Regular",Consolas,monospace; font-size: 13px; }

    /* ── Phase editor ────────────────────────────────────── */
    .phase-row { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .phase-row-name { flex: 1; background: transparent; border: none; color: var(--text); font-size: 14px; font-family: inherit; padding: 0; }
    .phase-row-name:focus { outline: none; }
    .status-btns { display: flex; gap: 4px; }
    .s-btn { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: all .15s; background: transparent; font-family: inherit; }
    .s-btn.done   { border-color: rgba(139,92,246,.4); color: var(--accent-light); }
    .s-btn.done.on   { background: rgba(139,92,246,.25); }
    .s-btn.active { border-color: var(--accent); color: var(--accent-light); }
    .s-btn.active.on { background: rgba(139,92,246,.15); }
    .s-btn.todo   { border-color: var(--border); color: var(--text-dim); }
    .s-btn.todo.on   { background: var(--surface-2); }

    /* ── Key points ──────────────────────────────────────── */
    .points-list { display: flex; flex-direction: column; gap: 10px; }
    .point-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
    .point-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .point-tag { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; flex-shrink: 0; margin-top: 2px; }
    .point-tag.insight  { background: rgba(139,92,246,.2);  color: var(--accent-light); border: 1px solid rgba(139,92,246,.3); }
    .point-tag.action   { background: rgba(34,197,94,.15);  color: #86efac;             border: 1px solid rgba(34,197,94,.3); }
    .point-tag.question { background: rgba(234,179,8,.15);  color: #fde047;             border: 1px solid rgba(234,179,8,.3); }
    .point-tag.risk     { background: rgba(239,68,68,.15);  color: #fca5a5;             border: 1px solid rgba(239,68,68,.3); }
    .point-body { flex: 1; min-width: 0; }
    .point-text { font-size: 14px; line-height: 1.6; }
    .point-meta { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
    .point-actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* ── Mind map ────────────────────────────────────────── */
    .mm-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; background: var(--surface); height: 520px; }
    #mm-svg { display: block; cursor: default; user-select: none; }
    .mm-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface-2); border-top: 1px solid var(--border); flex-wrap: wrap; }
    .mm-sel-label { font-size: 13px; color: var(--text-dim); flex: 1; }
    .mm-sel-label span { color: var(--accent-light); font-weight: 600; }

    /* ── Links ───────────────────────────────────────────── */
    .links-list { display: flex; flex-direction: column; gap: 8px; }
    .link-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--c-links); border-radius: var(--radius-sm); padding: 14px 18px; text-decoration: none; color: inherit; display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 12px; transition: border-color .15s, background .15s, transform .12s; box-shadow: var(--shadow); }
    .link-card:hover { background: var(--surface-2); transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .link-label { font-size: 14px; font-weight: 500; }
    .link-arrow { color: var(--c-links); font-size: 16px; flex-shrink: 0; }

    /* ── FAB ─────────────────────────────────────────────── */
    .fab { position: fixed; bottom: 24px; right: 24px; z-index: 50; width: 56px; height: 56px; border-radius: 50%; background: var(--primary-grad); color: #fff; border: none; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(139,92,246,.5); display: flex; align-items: center; justify-content: center; transition: transform .1s, box-shadow .15s; }
    .fab:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(139,92,246,.65); }
    .fab:active { transform: scale(.95); }

    /* ── Misc ────────────────────────────────────────────── */
    .loading { text-align: center; color: var(--text-dim); padding: 56px 0; font-size: 14px; }
    .error { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); border-radius: 10px; padding: 14px 16px; font-size: 14px; color: #fca5a5; }
    .empty { color: var(--text-dim); font-size: 14px; padding: 24px 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* phase section (legacy, kept for roadmap) */
    .phase-section { margin-bottom: 24px; }
    .sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .sec-label { font-family: 'Zen Maru Gothic',sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-dim); font-weight: 700; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#/" class="logo" id="header-logo">起業プロジェクト</a>
    <nav id="main-nav">
      <a href="#/roadmap"   data-section="roadmap">ロードマップ</a>
      <a href="#/canvas"    data-section="canvas">キャンバス</a>
      <a href="#/minutes"   data-section="minutes">議事録</a>
      <a href="#/decisions" data-section="decisions">決定事項</a>
      <a href="#/ideas"     data-section="ideas">アイデア</a>
      <a href="#/points"    data-section="points">ポイント</a>
      <a href="#/blueprint" data-section="blueprint">設計</a>
      <a href="#/notes"     data-section="notes">メモ</a>
      <a href="#/links"     data-section="links">リンク</a>
    </nav>
  </div>
</header>

<main id="app"><div class="loading">読み込み中…</div></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close-btn">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
// ═══ Storage ═══════════════════════════════════════════
const LS={
  get(k){try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v));},
  del(k){localStorage.removeItem(k);},
};

// ═══ Server data ════════════════════════════════════════
let _sCfg=null,_sIdx=null;

// ═══ Data layer ═════════════════════════════════════════
const getCfg  = () => LS.get('cfg')  ?? _sCfg ?? {};
const saveCfg = (c) => LS.set('cfg',c);
const getIdx  = () => LS.get('idx')  ?? _sIdx ?? {minutes:[],notes:[]};
const saveIdx = (i) => LS.set('idx',i);

async function getFile(path){
  const s=LS.get('f:'+path);
  if(s!==null) return s;
  return await fetchText(path);
}
const saveFile=(p,c)=>LS.set('f:'+p,c);

const getPoints  = () => LS.get('pts') ?? [];
const savePoints = (p) => LS.set('pts',p);
const getCanvas  = () => LS.get('canvas') ?? {};
const saveCanvas = (c) => LS.set('canvas',c);

function getRoadmap(){
  const s=LS.get('roadmap');
  if(s) return s;
  const phases=(getCfg().phases||[]).map((p,i)=>({
    id:'p'+i, name:p.name,
    tasks: i===0?[
      {id:'t0',text:'ターゲット顧客を5人インタビューする',status:'todo',date:''},
      {id:'t1',text:'リーンキャンバスを完成させる',status:'todo',date:''},
      {id:'t2',text:'市場・競合調査を実施する',status:'todo',date:''},
    ]:[]
  }));
  return {nextId:10,phases};
}
const saveRoadmap=(r)=>LS.set('roadmap',r);

// ═══ Fetch ══════════════════════════════════════════════
async function fetchJSON(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status+':'+p);return r.json();}
async function fetchText(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status+':'+p);return r.text();}

// ═══ Utils ══════════════════════════════════════════════
const esc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const slug=(f)=>f.replace(/^.*\//,'').replace(/\.md$/,'');
const app=()=>document.getElementById('app');
const today=()=>new Date().toISOString().split('T')[0];
function dlText(c,n){const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(c);a.download=n;a.click();}

// ═══ Modal ══════════════════════════════════════════════
function openModal(title,body,footer=''){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-footer').innerHTML=footer;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('modal-close-btn').onclick=closeModal;
document.getElementById('modal-overlay').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal-overlay'))closeModal();
});

// ═══ Router ═════════════════════════════════════════════
async function init(){
  try{
    [_sCfg,_sIdx]=await Promise.all([fetchJSON('config.json'),fetchJSON('content/index.json')]);
    const cfg=getCfg();
    document.getElementById('header-logo').textContent=cfg.projectName||'ダッシュボード';
    document.getElementById('page-title').textContent=cfg.projectName||'ダッシュボード';
  }catch(e){console.error(e);}
  window.addEventListener('hashchange',route);
  route();
}

function route(){
  const path=(location.hash||'#/').slice(1)||'/';
  document.querySelectorAll('#main-nav a').forEach(a=>{
    const h=a.getAttribute('href').slice(1);
    a.classList.toggle('active',path===h||(h!=='/'&&path.startsWith(h+'/')));
  });
  if(path==='/')             return renderHome();
  if(path==='/roadmap')      return renderRoadmap();
  if(path==='/canvas')       return renderCanvas();
  if(path==='/minutes')      return renderMinutesList();
  if(path.startsWith('/minutes/')) return renderMinute(path.slice(9));
  if(path==='/decisions')    return renderDecisions();
  if(path==='/ideas')        return renderIdeas();
  if(path==='/points')       return renderPoints();
  if(path==='/blueprint')    return renderBlueprint();
  if(path==='/notes')        return renderNotesList();
  if(path.startsWith('/notes/')) return renderNote(path.slice(7));
  if(path==='/links')        return renderLinks();
  renderHome();
}

// ═══ Icon chips ══════════════════════════════════════════
const _SVGS={
  roadmap:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 17h4"/></svg>',
  canvas:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
  minutes:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  decisions: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  ideas:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>',
  points:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 017 7c0 3.5-2.5 6-4 7.5V18a1 1 0 01-1 1H10a1 1 0 01-1-1v-1.5C7.5 15 5 12.5 5 9a7 7 0 017-7z"/><line x1="9" y1="21" x2="15" y2="21"/></svg>',
  blueprint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>',
  notes:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="13" x2="8" y2="13"/><line x1="12" y1="17" x2="8" y2="17"/><line x1="16" y1="9" x2="8" y2="9"/></svg>',
  links:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
};
function iconChip(key){
  return `<div class="card-icon-chip chip-${key}">${_SVGS[key]||''}</div>`;
}

// ═══ Vertical stepper ═══════════════════════════════════
function stepperHTML(phases){
  if(!phases||!phases.length) return '<p style="font-size:13px;color:var(--text-dim)">フェーズがありません</p>';
  const done=phases.filter(p=>p.status==='done').length;
  const total=phases.length;
  const pct=total?Math.round(done/total*100):0;
  const items=phases.map((p,i)=>{
    const isDone=p.status==='done', isAct=p.status==='active', isLast=i===phases.length-1;
    const lineClass=isDone?'done':isAct?'active':'todo';
    return `
      <div class="stepper-item">
        <div class="stepper-left">
          <div class="stepper-circle ${p.status}">${isDone?'✓':i+1}</div>
          ${!isLast?`<div class="stepper-line ${lineClass}"></div>`:''}
        </div>
        <div class="stepper-content">
          <div class="stepper-name${p.status==='todo'?' todo':''}">
            <span>${esc(p.name)}</span>
            ${isAct?'<span class="imahere-pill">イマここ</span>':''}
          </div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="stepper-summary">
      <div class="stepper-summary-label">Phase ${done} / ${total} 完了</div>
      <div class="stepper-summary-bar"><div class="stepper-summary-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stepper">${items}</div>`;
}

function mobilePhaseSummaryHTML(phases){
  const act=phases.find(p=>p.status==='active');

// ═══ Sugoroku helper (roadmap page) ═════════════════════
function shortName(s){
  return s.replace(/^Phase\s*\d+[:\s·–\-]*/i,'').trim().slice(0,11)||(s.slice(0,11));
}

function sugorokuHTML(phases,compact){
  const bsz=compact?38:50, wsz=compact?24:36;
  const fs=compact?14:18;
  const bubs=[], names=[];
  phases.forEach((p,i)=>{
    const isDone=p.status==='done', isAct=p.status==='active';
    bubs.push(`<div class="sg-bub ${p.status}" style="width:${bsz}px;height:${bsz}px;font-size:${fs}px;border-radius:${compact?8:10}px">${isDone?'✓':i+1}</div>`);
    names.push(`<div class="sg-nm ${p.status}" style="width:${bsz}px;padding-top:5px">${esc(shortName(p.name))}</div>`);
    if(i<phases.length-1){
      const wc=isDone?'done':isAct?'active':'todo';
      bubs.push(`<div class="sg-wire ${wc}" style="width:${wsz}px"></div>`);
      names.push(`<div class="sg-sp" style="width:${wsz}px"></div>`);
    }
  });
  return `<div class="sugoroku"><div class="sg-bubbles">${bubs.join('')}</div><div class="sg-names">${names.join('')}</div></div>`;
}

function getTodayTasks(){
  const rm=getRoadmap();
  const doing=[],todo=[];
  for(const ph of rm.phases){
    for(const t of ph.tasks){
      if(t.status==='doing') doing.push({...t,pn:ph.name});
      else if(t.status==='todo') todo.push({...t,pn:ph.name});
    }
  }
  return [...doing,...todo.slice(0,Math.max(0,4-doing.length))].slice(0,4);
}

function renderRoadmap(){
  const rm=getRoadmap();
  const focusTasks=[];
  for(const ph of rm.phases){
    for(const t of ph.tasks){
      if(t.status==='doing') focusTasks.push({...t,pn:ph.name,pid:ph.id});
    }
  }

  const focusHtml=focusTasks.length===0
    ?'<p style="font-size:13px;color:var(--text-muted)">進行中のタスクがありません</p>'
    :focusTasks.map(t=>`
      <div class="today-task">
        <div class="status-dot doing"></div>
        <span class="today-task-text">${esc(t.text)}</span>
        <span class="today-task-phase">${esc(t.pn)}</span>
      </div>`).join('');

  const phasesHtml=rm.phases.map(ph=>{
    const total=ph.tasks.length;
    const done=ph.tasks.filter(t=>t.status==='done').length;
    const pct=total?Math.round(done/total*100):0;
    const taskHtml=ph.tasks.map(t=>rmTaskRow(ph.id,t)).join('');
    return `
      <div class="rm-phase" id="rmp-${esc(ph.id)}">
        <div class="rm-phase-header" onclick="rmToggle('${esc(ph.id)}')">
          <span class="rm-phase-name">${esc(ph.name)}</span>
          <span class="rm-phase-prog">${done}/${total}</span>
          <div class="rm-phase-actions" onclick="event.stopPropagation()">
            <button class="icon-btn" onclick="openEditPhase('${esc(ph.id)}')" title="フェーズ編集">✏️</button>
            <button class="icon-btn" onclick="rmDelPhase('${esc(ph.id)}')" title="削除">🗑</button>
          </div>
          <span class="rm-phase-toggle" id="rmtog-${esc(ph.id)}">▼</span>
        </div>
        <div class="rm-prog-bar"><div class="rm-prog-fill" style="width:${pct}%"></div></div>
        <div class="rm-tasks" id="rmtasks-${esc(ph.id)}">
          ${taskHtml}
          <button class="rm-add-task" onclick="openAddTask('${esc(ph.id)}')">＋ タスクを追加</button>
        </div>
      </div>`;
  }).join('');

  app().innerHTML=`
    <div class="page-heading">
      <h2>ロードマップ</h2>
      <button class="btn btn-ghost btn-sm" onclick="openAddPhase()">＋ フェーズ追加</button>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:20px;box-shadow:var(--shadow)">
      ${sugorokuHTML(rm.phases,false)}
    </div>
    <div class="rm-focus">
      <div class="rm-focus-title">⚡ 進行中のタスク</div>
      ${focusHtml}
    </div>
    ${phasesHtml}
    ${rm.phases.length===0?'<p class="empty">フェーズがありません。「＋ フェーズ追加」から始めましょう。</p>':''}
  `;
}

function rmTaskRow(pid,t){
  const icon=t.status==='done'?'✓':t.status==='doing'?'⚡':'';
  return `
    <div class="rm-task" id="rmt-${esc(t.id)}">
      <button class="rm-status-btn ${esc(t.status)}" onclick="rmCycleStatus('${esc(pid)}','${esc(t.id)}')" title="ステータス変更">${icon}</button>
      <span class="rm-task-text${t.status==='done'?' done':''}">${esc(t.text)}</span>
      ${t.date?`<span class="rm-task-date">${esc(t.date)}</span>`:''}
      <div class="rm-task-actions">
        <button class="icon-btn" onclick="openEditTask('${esc(pid)}','${esc(t.id)}')">✏️</button>
        <button class="icon-btn" onclick="rmDelTask('${esc(pid)}','${esc(t.id)}')">🗑</button>
      </div>
    </div>`;
}

function rmToggle(pid){
  const body=document.getElementById('rmtasks-'+pid);
  const tog=document.getElementById('rmtog-'+pid);
  if(!body||!tog) return;
  const hidden=body.style.display==='none';
  body.style.display=hidden?'':'none';
  tog.classList.toggle('open',hidden);
}

window.rmCycleStatus=function(pid,tid){
  const rm=getRoadmap();
  const ph=rm.phases.find(p=>p.id===pid);
  if(!ph) return;
  const t=ph.tasks.find(x=>x.id===tid);
  if(!t) return;
  t.status=t.status==='todo'?'doing':t.status==='doing'?'done':'todo';
  saveRoadmap(rm);
  renderRoadmap();
};

window.rmDelTask=function(pid,tid){
  const rm=getRoadmap();
  const ph=rm.phases.find(p=>p.id===pid);
  if(!ph) return;
  ph.tasks=ph.tasks.filter(t=>t.id!==tid);
  saveRoadmap(rm);renderRoadmap();
};

window.rmDelPhase=function(pid){
  if(!confirm('このフェーズを削除しますか？タスクも全て削除されます。')) return;
  const rm=getRoadmap();
  rm.phases=rm.phases.filter(p=>p.id!==pid);
  saveRoadmap(rm);renderRoadmap();
};

window.openAddTask=function(pid){
  openModal('タスクを追加',
    `<div class="form-group"><label class="form-label">タスク内容</label><input class="form-input" id="tk-text" placeholder="例: ターゲット顧客を5人インタビュー"></div>
     <div class="form-group"><label class="form-label">期限（任意）</label><input class="form-input" id="tk-date" type="date"></div>
     <div class="form-group"><label class="form-label">ステータス</label>
     <select class="form-select" id="tk-st"><option value="todo">未着手</option><option value="doing">進行中</option><option value="done">完了</option></select></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="window._saveTask('${esc(pid)}',null)">追加</button>`);
  setTimeout(()=>document.getElementById('tk-text')?.focus(),50);
};

window.openEditTask=function(pid,tid){
  const rm=getRoadmap();
  const ph=rm.phases.find(p=>p.id===pid);
  const t=ph?.tasks.find(x=>x.id===tid);
  if(!t) return;
  openModal('タスクを編集',
    `<div class="form-group"><label class="form-label">タスク内容</label><input class="form-input" id="tk-text" value="${esc(t.text)}"></div>
     <div class="form-group"><label class="form-label">期限（任意）</label><input class="form-input" id="tk-date" type="date" value="${esc(t.date||'')}"></div>
     <div class="form-group"><label class="form-label">ステータス</label>
     <select class="form-select" id="tk-st">
       <option value="todo"${t.status==='todo'?' selected':''}>未着手</option>
       <option value="doing"${t.status==='doing'?' selected':''}>進行中</option>
       <option value="done"${t.status==='done'?' selected':''}>完了</option>
     </select></div>`,
    `<button class="btn btn-danger btn-sm" onclick="rmDelTask('${esc(pid)}','${esc(tid)}');closeModal()">削除</button>
     <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="window._saveTask('${esc(pid)}','${esc(tid)}')">保存</button>`);
};

window._saveTask=function(pid,tid){
  const text=document.getElementById('tk-text').value.trim();
  if(!text){alert('タスク内容を入力してください');return;}
  const rm=getRoadmap();
  const ph=rm.phases.find(p=>p.id===pid);
  if(!ph) return;
  const item={id:tid||'t'+(rm.nextId++),text,date:document.getElementById('tk-date').value,status:document.getElementById('tk-st').value};
  if(tid) {const i=ph.tasks.findIndex(t=>t.id===tid);if(i>=0)ph.tasks[i]=item;} else ph.tasks.push(item);
  saveRoadmap(rm);closeModal();renderRoadmap();
};

window.openAddPhase=function(){
  openModal('フェーズを追加',
    `<div class="form-group"><label class="form-label">フェーズ名</label><input class="form-input" id="ph-name" placeholder="例: Phase 2: 事業モデル設計"></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="
       const n=document.getElementById('ph-name').value.trim();
       if(!n){alert('フェーズ名を入力してください');return;}
       const rm=getRoadmap();
       rm.phases.push({id:'p'+(rm.nextId++),name:n,tasks:[]});
       saveRoadmap(rm);closeModal();renderRoadmap();
     ">追加</button>`);
  setTimeout(()=>document.getElementById('ph-name')?.focus(),50);
};

window.openEditPhase=function(pid){
  const ph=getRoadmap().phases.find(p=>p.id===pid);
  if(!ph) return;
  openModal('フェーズを編集',
    `<div class="form-group"><label class="form-label">フェーズ名</label><input class="form-input" id="ph-name" value="${esc(ph.name)}"></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="
       const n=document.getElementById('ph-name').value.trim();
       if(!n) return;
       const rm=getRoadmap();
       const p=rm.phases.find(x=>x.id==='${esc(pid)}');
       if(p)p.name=n;saveRoadmap(rm);closeModal();renderRoadmap();
     ">保存</button>`);
  setTimeout(()=>{const i=document.getElementById('ph-name');if(i){i.focus();i.select();}},50);
};

function renderCanvas(){

  const blocks=CB_DEFS.map(d=>`
    <div class="canvas-block ${d.cls}">
      <div class="cb-label">${d.label}</div>
      <div class="cb-hint">${d.hint}</div>
      <textarea class="cb-ta" data-key="${d.key}"
        placeholder="${d.hint}"
        onblur="saveCanvasField('${d.key}',this.value)">${esc(data[d.key]||'')}</textarea>
    </div>`).join('');

  app().innerHTML=`
    <div class="page-heading">
      <h2>リーンキャンバス</h2>
      <div class="row">
        <button class="btn btn-ghost btn-sm" onclick="exportCanvas()">⬇ MD出力</button>
        <button class="btn btn-ghost btn-sm" onclick="clearCanvas()">🗑 クリア</button>
      </div>
    </div>
    <p class="canvas-note">各ブロックに直接入力できます。入力内容はブラウザに自動保存されます。</p>
    <div style="height:12px"></div>
    <div class="canvas-grid">${blocks}</div>`;
}

window.saveCanvasField=function(key,val){
  const c=getCanvas();c[key]=val;saveCanvas(c);
};

window.exportCanvas=function(){
  const data=getCanvas();
  const lines=[`# リーンキャンバス\n`];
  for(const d of CB_DEFS){
    lines.push(`## ${d.label}`,data[d.key]||'（未記入）','');
  }
  dlText(lines.join('\n'),'lean-canvas.md');
};

window.clearCanvas=function(){
  if(!confirm('リーンキャンバスの内容をクリアしますか？'))return;
  saveCanvas({});renderCanvas();
};

window.saveQuickMinute=function(){
  const t=document.getElementById('qa-title').value.trim();
  const d=document.getElementById('qa-date').value.trim();
  const c=document.getElementById('qa-body').value;
  if(!t||!d){alert('タイトルと日付を入力してください');return;}
  const s=d+'-'+t.replace(/[\s　]+/g,'-').replace(/[^\w぀-鿿-]/g,'').slice(0,30)||'note';
  const file=`minutes/${s}.md`;
  const fullContent=`# ${t}\n\n${c}`;
  saveFile('content/'+file,fullContent);
  const idx=getIdx();
  idx.minutes=(idx.minutes||[]).filter(m=>slug(m.file)!==s);
  idx.minutes.push({file,title:t,date:d});
  saveIdx(idx);
  document.getElementById('qa-title').value='';
  document.getElementById('qa-body').value='';
  document.getElementById('qa-date').value=today();
  const items=(getIdx().minutes||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('tl-list').innerHTML=items.map(m=>`
    <a href="#/minutes/${esc(slug(m.file))}" class="tl-item">
      <div class="tl-dot"></div>
      <span class="tl-date">${esc(m.date)}</span>
      <span class="tl-title">${esc(m.title)}</span>
      <span class="tl-arr">→</span>
    </a>`).join('');
  document.getElementById('qa-title').focus();
};

const TYPE_LABELS={insight:'💡 気づき',action:'✅ アクション',question:'❓ 疑問',risk:'⚠️ リスク'};

function renderPoints(){
  const reList=()=>{
    const pts=getPoints();
    if(!pts.length) return '<p class="empty">まだポイントがありません。＋ボタンから追加してください。</p>';
    return `<div class="points-list">${pts.map((p,i)=>`
      <div class="point-card">
        <span class="point-tag ${esc(p.type||'insight')}">${TYPE_LABELS[p.type]||'💡 気づき'}</span>
        <div class="point-body"><div class="point-text">${esc(p.text)}</div><div class="point-meta">${esc(p.date||'')}${p.source?' · '+esc(p.source):''}</div></div>
        <div class="point-actions"><button class="icon-btn" onclick="editPoint(${i})">✏️</button><button class="icon-btn" onclick="delPoint(${i})">🗑</button></div>
      </div>`).join('')}</div>`;
  };
  app().innerHTML=`
    <div class="page-heading"><h2>ポイントまとめ</h2><button class="btn btn-ghost btn-sm" onclick="exportPoints()">⬇ MD出力</button></div>
    <div class="row" style="margin-bottom:16px">${Object.entries(TYPE_LABELS).map(([k,v])=>`<span class="point-tag ${k}">${v}</span>`).join('')}</div>
    <div id="pts-list">${reList()}</div>`;
  window._rePts=()=>{document.getElementById('pts-list').innerHTML=reList();};
  addFab(()=>openPointModal(null));
}

function openPointModal(editIdx){
  const ex=editIdx!==null?getPoints()[editIdx]:null;
  openModal(editIdx!==null?'ポイントを編集':'ポイントを追加',
    `<div class="form-group"><label class="form-label">種別</label>
     <select class="form-select" id="pt-type">${Object.entries(TYPE_LABELS).map(([k,v])=>`<option value="${k}"${(ex?.type||'insight')===k?' selected':''}>${v}</option>`).join('')}</select></div>
     <div class="form-group"><label class="form-label">内容</label><textarea class="form-textarea" id="pt-text" rows="4">${esc(ex?.text||'')}</textarea></div>
     <div class="form-group"><label class="form-label">日付</label><input class="form-input" id="pt-date" type="date" value="${esc(ex?.date||today())}"></div>
     <div class="form-group"><label class="form-label">出典・関連（任意）</label><input class="form-input" id="pt-src" value="${esc(ex?.source||'')}"></div>`,
    `${editIdx!==null?`<button class="btn btn-danger btn-sm" onclick="delPoint(${editIdx});closeModal()">削除</button>`:''}
     <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="window._savePt(${editIdx??-1})">保存</button>`);
  window._savePt=(idx)=>{
    const text=document.getElementById('pt-text').value.trim();
    if(!text){alert('内容を入力してください');return;}
    const item={type:document.getElementById('pt-type').value,text,date:document.getElementById('pt-date').value,source:document.getElementById('pt-src').value.trim()};
    const pts=getPoints();
    if(idx>=0)pts[idx]=item;else pts.unshift(item);
    savePoints(pts);closeModal();if(window._rePts)window._rePts();
  };
}

window.editPoint=(i)=>openPointModal(i);
window.delPoint=(i)=>{const p=getPoints();p.splice(i,1);savePoints(p);if(window._rePts)window._rePts();};
window.exportPoints=()=>{
  const lines=['# ポイントまとめ\n'];
  for(const p of getPoints()) lines.push(`## ${TYPE_LABELS[p.type]||'気づき'} (${p.date||''})`,p.text,p.source?`_出典: ${p.source}_`:'','');
  dlText(lines.join('\n'),'points.md');
};

// ═══ Mind Map ════════════════════════════════════════════
let mm={data:null,sel:null,drag:null,ds:null,ns:null,moved:false,raf:false};
function getMM(){
  const s=LS.get('mm');if(s)return s;
  const cfg=getCfg();
  return{nextId:6,nodes:[
    {id:'root',text:cfg.projectName||'プロジェクト',x:800,y:450,pid:null},
    {id:'2',text:'コンセプト',x:560,y:300,pid:'root'},
    {id:'3',text:'収益モデル',x:1040,y:300,pid:'root'},
    {id:'4',text:'課題・仮説',x:560,y:600,pid:'root'},
    {id:'5',text:'顧客セグメント',x:1040,y:600,pid:'root'},
  ]};
}
const saveMM=(m)=>LS.set('mm',m);

function renderIdeas(){
  app().innerHTML=`
    <div class="page-heading"><h2>アイデアマップ</h2>
    <div class="row">
      <button class="btn btn-ghost btn-sm" onclick="mmAddToRoot()">＋ アイデア追加</button>
      <button class="btn btn-ghost btn-sm" onclick="mmReset()">リセット</button>
    </div></div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:10px">クリックで選択、ドラッグで移動。ツールバーで操作。</p>
    <div>
      <div class="mm-wrap"><svg id="mm-svg" width="1600" height="900"></svg></div>
      <div class="mm-toolbar">
        <span class="mm-sel-label" id="mm-lbl">ノードを選択してください</span>
        <button class="btn btn-ghost btn-sm" id="mm-add" style="display:none" onclick="mmAddChild()">＋ 子追加</button>
        <button class="btn btn-ghost btn-sm" id="mm-edit" style="display:none" onclick="mmEdit()">✏️ 編集</button>
        <button class="btn btn-danger btn-sm" id="mm-del" style="display:none" onclick="mmDel()">🗑 削除</button>
      </div>
    </div>`;
  mm.data=getMM();mm.sel=null;
  mmRender();
  const svg=document.getElementById('mm-svg');
  if(!svg)return;
  svg.addEventListener('mousedown',mmMD);svg.addEventListener('click',mmCk);
  svg.addEventListener('touchstart',mmTS,{passive:false});
  const w=document.querySelector('.mm-wrap');if(w){w.scrollLeft=400;w.scrollTop=180;}
}

function mmRender(){
  const svg=document.getElementById('mm-svg');if(!svg||!mm.data)return;
  const NS='http://www.w3.org/2000/svg';svg.innerHTML='';
  for(const n of mm.data.nodes){
    if(!n.pid)continue;
    const p=mm.data.nodes.find(x=>x.id===n.pid);if(!p)continue;
    const path=document.createElementNS(NS,'path');
    const mx=(p.x+n.x)/2;
    path.setAttribute('d',`M ${p.x} ${p.y} C ${mx} ${p.y}, ${mx} ${n.y}, ${n.x} ${n.y}`);
    path.setAttribute('fill','none');path.setAttribute('stroke','rgba(139,92,246,.3)');
    path.setAttribute('stroke-width',n.pid==='root'?'2':'1.5');
    svg.appendChild(path);
  }
  for(const n of mm.data.nodes){
    const isRoot=n.id==='root',isSel=n.id===mm.sel;
    const w=Math.max(n.text.length*11+28,80),h=isRoot?44:34;
    const g=document.createElementNS(NS,'g');
    g.setAttribute('data-id',n.id);g.setAttribute('transform',`translate(${n.x},${n.y})`);g.style.cursor='grab';
    const rect=document.createElementNS(NS,'rect');
    rect.setAttribute('x',-w/2);rect.setAttribute('y',-h/2);rect.setAttribute('width',w);rect.setAttribute('height',h);rect.setAttribute('rx',isRoot?'12':'8');
    rect.setAttribute('fill',isRoot?'rgba(109,40,217,.75)':'rgba(44,35,68,.95)');
    rect.setAttribute('stroke',isSel?'#a78bfa':isRoot?'rgba(139,92,246,.6)':'rgba(139,92,246,.25)');
    rect.setAttribute('stroke-width',isSel?'2.5':'1.5');
    if(isSel)rect.setAttribute('filter','drop-shadow(0 0 6px rgba(139,92,246,.5))');
    const text=document.createElementNS(NS,'text');
    text.setAttribute('text-anchor','middle');text.setAttribute('dominant-baseline','middle');
    const _tc=getComputedStyle(document.documentElement).getPropertyValue('--text').trim()||'#f1ecfb';
    text.setAttribute('fill',_tc);text.setAttribute('font-size',isRoot?'14':'13');
    text.setAttribute('font-weight',isRoot?'700':'500');text.setAttribute('pointer-events','none');
    text.setAttribute('font-family','\'Noto Sans JP\',-apple-system,sans-serif');text.textContent=n.text;
    g.appendChild(rect);g.appendChild(text);svg.appendChild(g);
  }
  const lbl=document.getElementById('mm-lbl');
  const add=document.getElementById('mm-add'),edit=document.getElementById('mm-edit'),del=document.getElementById('mm-del');
  if(!lbl)return;
  if(!mm.sel){lbl.innerHTML='ノードを選択してください';[add,edit,del].forEach(b=>{if(b)b.style.display='none';});return;}
  const n=mm.data.nodes.find(x=>x.id===mm.sel);
  if(!n)return;
  lbl.innerHTML=`選択中: <span>${esc(n.text)}</span>`;
  if(add)add.style.display='';if(edit)edit.style.display='';
  if(del)del.style.display=n.id==='root'?'none':'';
}

function svgPt(e,s){const p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse());}
function svgPtT(t,s){const p=s.createSVGPoint();p.x=t.clientX;p.y=t.clientY;return p.matrixTransform(s.getScreenCTM().inverse());}
function mmMD(e){
  const g=e.target.closest('[data-id]');if(!g)return;
  e.preventDefault();e.stopPropagation();
  const id=g.getAttribute('data-id');
  mm.sel=id;mm.drag=id;mm.moved=false;
  const svg=document.getElementById('mm-svg');
  const pt=svgPt(e,svg);mm.ds={x:pt.x,y:pt.y};
  const n=mm.data.nodes.find(x=>x.id===id);
  mm.ns=n?{x:n.x,y:n.y}:{x:0,y:0};
  mmRender();
  document.addEventListener('mousemove',mmMM);
  document.addEventListener('mouseup',mmMU);
}
function mmMM(e){
  if(!mm.drag)return;
  const svg=document.getElementById('mm-svg');if(!svg)return;
  const pt=svgPt(e,svg);
  const dx=pt.x-mm.ds.x,dy=pt.y-mm.ds.y;
  if(Math.abs(dx)+Math.abs(dy)>3)mm.moved=true;
  if(!mm.moved)return;
  const n=mm.data.nodes.find(x=>x.id===mm.drag);if(!n)return;
  n.x=mm.ns.x+dx;n.y=mm.ns.y+dy;
  if(!mm.raf){mm.raf=true;requestAnimationFrame(()=>{mm.raf=false;mmRender();});}
}
function mmMU(){
  if(mm.drag&&mm.moved)saveMM(mm.data);
  mm.drag=null;
  document.removeEventListener('mousemove',mmMM);
  document.removeEventListener('mouseup',mmMU);
}
function mmCk(e){if(!e.target.closest('[data-id]')&&!mm.moved){mm.sel=null;mmRender();}mm.moved=false;}
function mmTS(e){
  const g=e.target.closest('[data-id]');if(!g)return;
  e.preventDefault();
  const id=g.getAttribute('data-id');
  mm.sel=id;mm.drag=id;mm.moved=false;
  const svg=document.getElementById('mm-svg');
  const pt=svgPtT(e.touches[0],svg);mm.ds={x:pt.x,y:pt.y};
  const n=mm.data.nodes.find(x=>x.id===id);
  mm.ns=n?{x:n.x,y:n.y}:{x:0,y:0};
  mmRender();
  document.addEventListener('touchmove',mmTM,{passive:false});
  document.addEventListener('touchend',mmTE);
}
function mmTM(e){
  if(!mm.drag)return;e.preventDefault();
  const svg=document.getElementById('mm-svg');if(!svg)return;
  const pt=svgPtT(e.touches[0],svg);
  const dx=pt.x-mm.ds.x,dy=pt.y-mm.ds.y;
  if(Math.abs(dx)+Math.abs(dy)>3)mm.moved=true;
  if(!mm.moved)return;
  const n=mm.data.nodes.find(x=>x.id===mm.drag);if(!n)return;
  n.x=mm.ns.x+dx;n.y=mm.ns.y+dy;
  if(!mm.raf){mm.raf=true;requestAnimationFrame(()=>{mm.raf=false;mmRender();});}
}
function mmTE(){
  if(mm.drag&&mm.moved)saveMM(mm.data);
  mm.drag=null;
  document.removeEventListener('touchmove',mmTM);
  document.removeEventListener('touchend',mmTE);
}

function mmAddChild(){
  const pid=mm.sel||'root';const parent=mm.data.nodes.find(n=>n.id===pid);if(!parent)return;
  const kids=mm.data.nodes.filter(n=>n.pid===pid).length;
  const id='n'+(mm.data.nextId++);
  const side=kids%2===0?1:-1;
  mm.data.nodes.push({id,text:'新しいアイデア',x:parent.x+(parent.id==='root'?220*side:200),y:parent.y+kids*70-35,pid});
  mm.sel=id;saveMM(mm.data);mmRender();mmEdit();
}
window.mmAddChild=mmAddChild;
window.mmAddToRoot=()=>{mm.sel='root';mmAddChild();};
window.mmEdit=()=>{
  const n=mm.data.nodes.find(x=>x.id===mm.sel);if(!n)return;
  openModal('ノードを編集',
    `<div class="form-group"><label class="form-label">テキスト</label><input class="form-input" id="mm-inp" value="${esc(n.text)}" style="font-size:16px"></div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
     <button class="btn btn-primary" onclick="
       const v=document.getElementById('mm-inp').value.trim();
       if(v){const nd=mm.data.nodes.find(x=>x.id===mm.sel);if(nd)nd.text=v;saveMM(mm.data);closeModal();mmRender();}
     ">保存</button>`);
  setTimeout(()=>{const i=document.getElementById('mm-inp');if(i){i.focus();i.select();}},50);
};
window.mmDel=()=>{
  if(!mm.sel||mm.sel==='root')return;
  const del=new Set();const q=[mm.sel];
  while(q.length){const c=q.shift();del.add(c);mm.data.nodes.filter(n=>n.pid===c).forEach(n=>q.push(n.id));}
  mm.data.nodes=mm.data.nodes.filter(n=>!del.has(n.id));mm.sel=null;saveMM(mm.data);mmRender();
};
window.mmReset=()=>{
  if(!confirm('マインドマップをリセットしますか？'))return;
  LS.del('mm');mm.data=getMM();mm.sel=null;mmRender();
};

    <div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-ghost btn-sm" id="edit-note">✏️ 編集</button></div>
    <div class="md-content" id="note-body">${marked.parse(text)}</div>`;
  document.getElementById('edit-note').onclick=()=>openMdEditor(entry?.title||sl,fp,text,nc=>{text=nc;document.getElementById('note-body').innerHTML=marked.parse(nc);});
}

// ═══ Links ══════════════════════════════════════════════
function renderLinks(){
  const links=getCfg().links||[];
  const html=!links.length?'<p class="empty">config.json の links に追加してください。</p>'
    :links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" class="link-card"><span class="link-label">${esc(l.label)}</span><span class="link-arrow">↗</span></a>`).join('');
  app().innerHTML=`<div class="page-heading"><h2>リンク集</h2></div><div class="links-list">${html}</div>`;
}

// ═══ FAB ════════════════════════════════════════════════
function addFab(onClick){
  const btn=document.createElement('button');
  btn.className='fab';btn.innerHTML='+';btn.onclick=onClick;
  app().appendChild(btn);
}

// ═══ Boot ═══════════════════════════════════════════════
init();
</script>
</body>
</html>
